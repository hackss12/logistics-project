{% extends "base.html" %}
{% block title %}Change password · Mohan Logistics{% endblock %}
{% block content %}
<section class="login-wrap">
  <div class="login-card">
    <div class="eyebrow">ACCOUNT SECURITY</div>
    <h1>Change password</h1>
    <p class="muted">Use a unique password with at least 12 characters.</p>
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label>
      <label>New password<input type="password" name="new_password" minlength="12" autocomplete="new-password" required></label>
      <label>Confirm new password<input type="password" name="confirm_password" minlength="12" autocomplete="new-password" required></label>
      <button class="button primary full" type="submit">Update password</button>
    </form>
  </div>
</section>
{% endblock %}
